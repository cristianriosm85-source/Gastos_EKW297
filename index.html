<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte — Conductor</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Syne',sans-serif;background:#F5F3EE;color:#1A1A1A;min-height:100vh}
.header{background:#1A1A1A;color:white;padding:1.5rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
.header h1{font-size:1.35rem;font-weight:800;letter-spacing:-.03em}
.header p{font-size:.75rem;color:#999;font-family:'DM Mono',monospace;margin-top:3px}
.btn-reload{background:#2A2A2A;border:1px solid #444;color:#ccc;padding:8px 16px;border-radius:8px;font-family:'Syne',sans-serif;font-weight:600;font-size:.8rem;cursor:pointer}
.btn-reload:hover{background:#333}
.container{max-width:900px;margin:0 auto;padding:1.5rem}

/* TABS */
.tabs{display:flex;background:white;border:1px solid #E2DDD5;border-radius:12px;padding:4px;gap:4px;margin-bottom:1.5rem}
.tab{flex:1;text-align:center;padding:9px 8px;border-radius:9px;font-size:.82rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:#888;transition:all .15s}
.tab.active{background:#1A1A1A;color:white}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
.kpi{background:white;border:1px solid #E2DDD5;border-radius:12px;padding:1rem 1.1rem}
.kpi.bl{border-left:4px solid #1A7A4A}
.kpi.rl{border-left:4px solid #C0392B}
.kpi.nl{border-left:4px solid #1A1A1A}
.kpi-label{font-size:.63rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.kpi-val{font-family:'DM Mono',monospace;font-size:1.35rem;font-weight:500}
.kpi-val.g{color:#1A7A4A}.kpi-val.r{color:#C0392B}
.kpi-sub{font-size:.68rem;color:#aaa;margin-top:3px;font-family:'DM Mono',monospace}

/* PANEL SEMANAS / DIAS */
.panel{background:white;border:1px solid #E2DDD5;border-radius:12px;overflow:hidden;margin-bottom:1.25rem}
.panel-head{padding:.9rem 1.4rem;border-bottom:1px solid #E2DDD5;display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.panel-count{font-size:.7rem;color:#aaa;font-family:'DM Mono',monospace}
.panel-body{padding:1.1rem 1.4rem}

/* BLOQUE SEMANA */
.semana{margin-bottom:1.5rem}
.semana:last-child{margin-bottom:0}
.semana-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:2px solid #E2DDD5;margin-bottom:10px}
.semana-titulo{font-size:.78rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.05em}
.semana-neta{font-family:'DM Mono',monospace;font-size:1rem;font-weight:500}
.semana-detalle{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.s-mini{background:#F5F3EE;border-radius:8px;padding:8px 10px;text-align:center}
.s-mini-label{font-size:.6rem;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.s-mini-val{font-family:'DM Mono',monospace;font-size:.88rem;font-weight:500}

/* BLOQUE DIA dentro de semana */
.dia{padding:8px 0;border-bottom:1px solid #F5F3EE}
.dia:last-child{border-bottom:none}
.dia-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.dia-nombre{font-size:.85rem;font-weight:500}
.dia-fecha-pequeña{font-size:.7rem;color:#aaa;margin-top:1px}
.dia-neta{font-family:'DM Mono',monospace;font-size:.88rem;font-weight:500}
.dia-registros{padding:6px 0 0 16px;display:none}
.dia-registros.open{display:block}
.fila{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.fila-izq{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dg{background:#1A7A4A}.dr{background:#C0392B}
.fila-tipo{font-size:.82rem}
.fila-hora{font-size:.68rem;color:#aaa}
.fila-monto{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:500}
.fila-monto.g{color:#1A7A4A}.fila-monto.r{color:#C0392B}
.chevron{font-size:.65rem;color:#aaa;transition:transform .2s}
.chevron.open{transform:rotate(180deg)}

/* MES */
.mes-bloque{margin-bottom:1.5rem}
.mes-bloque:last-child{margin-bottom:0}
.mes-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:2px solid #E2DDD5;margin-bottom:12px}
.mes-titulo{font-size:.88rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mes-neta{font-family:'DM Mono',monospace;font-size:1.05rem;font-weight:500}
.mes-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mk{background:#F5F3EE;border-radius:8px;padding:10px;text-align:center}
.mk-label{font-size:.6rem;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.mk-val{font-family:'DM Mono',monospace;font-size:.95rem;font-weight:500}

.vacio{text-align:center;padding:2.5rem 1rem;color:#aaa;font-size:.85rem}
.loading{text-align:center;padding:2.5rem;color:#aaa;font-size:.85rem}
.err-box{background:#FDECEA;border:1px solid #f5c6c2;border-radius:10px;padding:.9rem 1.2rem;color:#C0392B;font-size:.82rem;margin-bottom:1.25rem}

@media(max-width:520px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpis .kpi:last-child{grid-column:1/-1}
  .mes-kpis{grid-template-columns:1fr 1fr}
  .mes-kpis .mk:last-child{grid-column:1/-1}
  .container{padding:1rem}
  .header{padding:1.2rem 1rem}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Reporte del Conductor</h1>
    <p id="ultimo-sync">Cargando...</p>
  </div>
  <button class="btn-reload" onclick="cargarDatos()">↻ Actualizar</button>
</div>

<div class="container">
  <div id="err-box" style="display:none" class="err-box"></div>

  <div class="tabs">
    <button class="tab active" onclick="cambiarTab('semana')">Por semana</button>
    <button class="tab" onclick="cambiarTab('mes')">Por mes</button>
  </div>

  <div id="vista-semana">
    <div class="kpis" id="kpis-semana">
      <div class="kpi bl"><div class="kpi-label">Esta semana</div><div class="kpi-val g" id="sw-g">—</div><div class="kpi-sub">ganancias</div></div>
      <div class="kpi rl"><div class="kpi-label">Esta semana</div><div class="kpi-val r" id="sw-r">—</div><div class="kpi-sub">gastos</div></div>
      <div class="kpi nl"><div class="kpi-label">Libre esta semana</div><div class="kpi-val" id="sw-n">—</div><div class="kpi-sub" id="sw-dias"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Semanas</span><span class="panel-count" id="cnt-semana"></span></div>
      <div class="panel-body" id="body-semana"><div class="loading">Cargando...</div></div>
    </div>
  </div>

  <div id="vista-mes" style="display:none">
    <div class="kpis" id="kpis-mes">
      <div class="kpi bl"><div class="kpi-label">Este mes</div><div class="kpi-val g" id="mm-g">—</div><div class="kpi-sub">ganancias</div></div>
      <div class="kpi rl"><div class="kpi-label">Este mes</div><div class="kpi-val r" id="mm-r">—</div><div class="kpi-sub">gastos</div></div>
      <div class="kpi nl"><div class="kpi-label">Libre este mes</div><div class="kpi-val" id="mm-n">—</div><div class="kpi-sub" id="mm-dias"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Meses</span><span class="panel-count" id="cnt-mes"></span></div>
      <div class="panel-body" id="body-mes"><div class="loading">Cargando...</div></div>
    </div>
  </div>
</div>

<script>
const SCRIPT = "https://script.google.com/macros/s/AKfycbzRzKxoZdaYggSBqgat4ACEPZuXjXXs7vg5ZgCNk72JTAX0zZMHPvtqLZaIQyBICARdhA/exec";
let todos = [];
let tabActual = 'semana';

function fmt(n){ return '$'+parseFloat(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function lunes(d){
  const dt = new Date(d+'T12:00:00');
  const day = dt.getDay();
  const diff = (day===0?-6:1-day);
  const l = new Date(dt);
  l.setDate(dt.getDate()+diff);
  return l.toISOString().split('T')[0];
}

function clavesMes(fecha){ return fecha.substring(0,7); } // YYYY-MM

function semanaLabel(lun){
  const l = new Date(lun+'T12:00:00');
  const d = new Date(l); d.setDate(l.getDate()+6);
  const ops = {day:'numeric',month:'short'};
  return l.toLocaleDateString('es-MX',ops)+' – '+d.toLocaleDateString('es-MX',ops);
}

function mesLabel(clave){
  const [y,m] = clave.split('-');
  return new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});
}

function diaNombre(fecha){
  return new Date(fecha+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'short'});
}

function calcTotales(items){
  const g = items.filter(r=>r.tipo==='ganancia').reduce((s,r)=>s+r.monto,0);
  const r = items.filter(r=>r.tipo==='gasto').reduce((s,r)=>s+r.monto,0);
  return {g, r, n: g-r};
}

function colorNeta(n){ return n>=0?'#1A7A4A':'#C0392B'; }

function toggleDia(el){
  const reg = el.nextElementSibling;
  const chev = el.querySelector('.chevron');
  const isOpen = reg.classList.contains('open');
  reg.classList.toggle('open',!isOpen);
  chev.classList.toggle('open',!isOpen);
}

async function cargarDatos(){
  document.getElementById('body-semana').innerHTML='<div class="loading">Conectando con Google Sheets...</div>';
  document.getElementById('body-mes').innerHTML='<div class="loading">Conectando con Google Sheets...</div>';
  document.getElementById('err-box').style.display='none';
  try {
    const res = await fetch(SCRIPT+'?action=load&t='+Date.now());
    todos = await res.json();
    if(!Array.isArray(todos)) throw new Error();
    todos = todos.map(r=>({...r,monto:parseFloat(r.monto)||0}));
    document.getElementById('ultimo-sync').textContent =
      'Actualizado: '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    renderSemanas();
    renderMeses();
  } catch(e){
    const b=document.getElementById('err-box');
    b.textContent='No se pudo conectar con Google Sheets. Verifica que el script esté bien desplegado.';
    b.style.display='block';
    document.getElementById('body-semana').innerHTML='<div class="vacio">Sin datos.</div>';
    document.getElementById('body-mes').innerHTML='<div class="vacio">Sin datos.</div>';
  }
}

function renderSemanas(){
  // Agrupar por semana (lunes a domingo)
  const semanas = {};
  todos.forEach(r=>{
    const lun = lunes(r.fecha);
    if(!semanas[lun]) semanas[lun]={};
    if(!semanas[lun][r.fecha]) semanas[lun][r.fecha]=[];
    semanas[lun][r.fecha].push(r);
  });

  // KPIs semana actual
  const lunHoy = lunes(new Date().toISOString().split('T')[0]);
  const semActual = semanas[lunHoy] ? Object.values(semanas[lunHoy]).flat() : [];
  const sa = calcTotales(semActual);
  document.getElementById('sw-g').textContent = fmt(sa.g);
  document.getElementById('sw-r').textContent = fmt(sa.r);
  const swn = document.getElementById('sw-n');
  swn.textContent = fmt(sa.n);
  swn.style.color = colorNeta(sa.n);
  document.getElementById('sw-dias').textContent = new Set(semActual.map(r=>r.fecha)).size+' días activos';

  const keys = Object.keys(semanas).sort((a,b)=>b.localeCompare(a));
  document.getElementById('cnt-semana').textContent = keys.length+' semanas';

  if(!keys.length){
    document.getElementById('body-semana').innerHTML='<div class="vacio">No hay registros todavía.</div>';
    return;
  }

  document.getElementById('body-semana').innerHTML = keys.map((lun,si)=>{
    const diasObj = semanas[lun];
    const todosItems = Object.values(diasObj).flat();
    const t = calcTotales(todosItems);
    const esActual = lun === lunHoy;
    const diasKeys = Object.keys(diasObj).sort((a,b)=>b.localeCompare(a));

    return `<div class="semana">
      <div class="semana-head">
        <div>
          <div class="semana-titulo">${esActual?'Esta semana — ':''} ${semanaLabel(lun)}</div>
        </div>
        <span class="semana-neta" style="color:${colorNeta(t.n)}">${t.n>=0?'+':''}${fmt(t.n)}</span>
      </div>
      <div class="semana-detalle">
        <div class="s-mini"><div class="s-mini-label">Ganancias</div><div class="s-mini-val" style="color:#1A7A4A">${fmt(t.g)}</div></div>
        <div class="s-mini"><div class="s-mini-label">Gastos</div><div class="s-mini-val" style="color:#C0392B">${fmt(t.r)}</div></div>
      </div>
      ${diasKeys.map((fecha,di)=>{
        const items = diasObj[fecha];
        const dt = calcTotales(items);
        const uid = 'dia-'+si+'-'+di;
        return `<div class="dia">
          <div class="dia-head" onclick="toggleDia(this)">
            <div>
              <div class="dia-nombre">${diaNombre(fecha)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="dia-neta" style="color:${colorNeta(dt.n)}">${dt.n>=0?'+':''}${fmt(dt.n)}</span>
              <span class="chevron">▼</span>
            </div>
          </div>
          <div class="dia-registros" id="${uid}">
            ${items.sort((a,b)=>(a.hora||'').localeCompare(b.hora||'')).map(r=>`
              <div class="fila">
                <div class="fila-izq">
                  <div class="dot ${r.tipo==='ganancia'?'dg':'dr'}"></div>
                  <div>
                    <div class="fila-tipo">${r.tipo==='ganancia'?'Ganancia':'Gasto'}</div>
                    ${r.hora?`<div class="fila-hora">${r.hora}</div>`:''}
                  </div>
                </div>
                <span class="fila-monto ${r.tipo==='ganancia'?'g':'r'}">${r.tipo==='ganancia'?'+':'-'}${fmt(r.monto)}</span>
              </div>
            `).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function renderMeses(){
  // Mes = del 1 al último día del mes calendario
  const meses = {};
  todos.forEach(r=>{
    const clave = clavesMes(r.fecha);
    if(!meses[clave]) meses[clave]=[];
    meses[clave].push(r);
  });

  // KPIs mes actual
  const mesActual = clavesMes(new Date().toISOString().split('T')[0]);
  const ma = calcTotales(meses[mesActual]||[]);
  document.getElementById('mm-g').textContent = fmt(ma.g);
  document.getElementById('mm-r').textContent = fmt(ma.r);
  const mmn = document.getElementById('mm-n');
  mmn.textContent = fmt(ma.n);
  mmn.style.color = colorNeta(ma.n);
  document.getElementById('mm-dias').textContent = new Set((meses[mesActual]||[]).map(r=>r.fecha)).size+' días activos';

  const keys = Object.keys(meses).sort((a,b)=>b.localeCompare(a));
  document.getElementById('cnt-mes').textContent = keys.length+' meses';

  if(!keys.length){
    document.getElementById('body-mes').innerHTML='<div class="vacio">No hay registros todavía.</div>';
    return;
  }

  document.getElementById('body-mes').innerHTML = keys.map(clave=>{
    const items = meses[clave];
    const t = calcTotales(items);
    const esActual = clave===mesActual;
    const dias = new Set(items.map(r=>r.fecha)).size;
    const promDia = dias>0 ? t.n/dias : 0;

    // Agrupar por día dentro del mes
    const porDia = {};
    items.forEach(r=>{ if(!porDia[r.fecha]) porDia[r.fecha]=[]; porDia[r.fecha].push(r); });
    const diasKeys = Object.keys(porDia).sort((a,b)=>b.localeCompare(a));

    return `<div class="mes-bloque">
      <div class="mes-head">
        <div class="mes-titulo">${esActual?'⬤ ':''} ${mesLabel(clave)}</div>
        <span class="mes-neta" style="color:${colorNeta(t.n)}">${t.n>=0?'+':''}${fmt(t.n)}</span>
      </div>
      <div class="mes-kpis">
        <div class="mk"><div class="mk-label">Ganancias</div><div class="mk-val" style="color:#1A7A4A">${fmt(t.g)}</div></div>
        <div class="mk"><div class="mk-label">Gastos</div><div class="mk-val" style="color:#C0392B">${fmt(t.r)}</div></div>
        <div class="mk"><div class="mk-label">Prom / día</div><div class="mk-val" style="color:${colorNeta(promDia)}">${fmt(promDia)}</div></div>
      </div>
      ${diasKeys.map((fecha,di)=>{
        const dItems = porDia[fecha];
        const dt = calcTotales(dItems);
        return `<div class="dia">
          <div class="dia-head" onclick="toggleDia(this)">
            <div class="dia-nombre">${diaNombre(fecha)}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="dia-neta" style="color:${colorNeta(dt.n)}">${dt.n>=0?'+':''}${fmt(dt.n)}</span>
              <span class="chevron">▼</span>
            </div>
          </div>
          <div class="dia-registros">
            ${dItems.sort((a,b)=>(a.hora||'').localeCompare(b.hora||'')).map(r=>`
              <div class="fila">
                <div class="fila-izq">
                  <div class="dot ${r.tipo==='ganancia'?'dg':'dr'}"></div>
                  <div>
                    <div class="fila-tipo">${r.tipo==='ganancia'?'Ganancia':'Gasto'}</div>
                    ${r.hora?`<div class="fila-hora">${r.hora}</div>`:''}
                  </div>
                </div>
                <span class="fila-monto ${r.tipo==='ganancia'?'g':'r'}">${r.tipo==='ganancia'?'+':'-'}${fmt(r.monto)}</span>
              </div>
            `).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function cambiarTab(tab){
  tabActual = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('vista-semana').style.display = tab==='semana'?'':'none';
  document.getElementById('vista-mes').style.display = tab==='mes'?'':'none';
}

cargarDatos();
setInterval(cargarDatos, 120000);
</script>
</body>
</html>
